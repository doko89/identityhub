    <title>IdentityHub</title>
    <script>
      // Pre-paint theme (DESIGN.md §3): the stored choice wins, otherwise
      // follow the OS. Runs before first paint so the page never flashes
      // the wrong theme; BrandProvider re-applies with the server brand
      // default once it loads.
      (function () {
        try {
          var stored = localStorage.getItem("ih-theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              stored !== "dark" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* private mode: fall through to the light default */
        }
      })();
    </script>
